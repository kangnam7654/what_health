name: ExercisePlanApp
options:
  bundleIdPrefix: com.exerciseplan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

targets:
  ExercisePlanApp:
    type: application
    platform: iOS
    sources:
      - path: ExercisePlanApp
        type: group
    entitlements:
      path: ExercisePlanApp/ExercisePlanApp.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.in-app-payments: []
    info:
      path: ExercisePlanApp/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.exerciseplan.app
            CFBundleURLName: com.exerciseplan.app.oauth
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.exerciseplan.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ExercisePlanApp/ExercisePlanApp.entitlements
